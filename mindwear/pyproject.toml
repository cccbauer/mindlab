[project]
name = "mindwear"
version = "0.1.0"
description = "Real-time EEG neurofeedback on the Emotiv EPOC X, running the frozen DMNELF EFP decoder"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "mne>=1.6",
    "pyyaml>=6.0",
    "flet==0.86.5",
    "flet-charts==0.86.5",
    "flet-desktop==0.86.5",
    "psychopy>=2024.1",
    "pylsl>=1.16",
    "websocket-client>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
